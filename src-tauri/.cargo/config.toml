# Static-link the C runtime (UCRT/CRT): removes the api-ms-win-crt-*.dll dependency,
# so the exe still runs on stripped-down / Win7 machines without UCRT (lesson learned: missing VC++ DLLs stop apps starting).
# Cost: slightly larger exe; benefit: a fully self-contained single file.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
