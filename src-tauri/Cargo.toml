[package]
name = "mdaddy"
version = "0.6.0"
description = "Mdaddy - simple Markdown editor"
authors = ["frandy820"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Globalization"] }
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"

# v0.3.28 size optimisation (keep the app small and easy to share): LTO + symbol stripping + size-first codegen.
# Note: run cargo clean after changing this section (a mixed target cache silently falls back to the old config).
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
